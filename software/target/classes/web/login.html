<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in to the Resume-Job Matcher dashboard to compare resumes and job descriptions."
    />
    <title>Sign In | Resume-Job Matcher</title>
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/main.js"></script>
    <script defer src="js/auth.js"></script>
  </head>
  <body class="page-dark">
    <header class="topbar">
      <div class="container nav-wrap">
        <div class="brand">RESUME-JOB MATCHER</div>
        <nav class="nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="login.html" class="active">Login</a>
          <a href="register.html">Register</a>
        </nav>
      </div>
    </header>

    <main class="auth-page">
      <div class="auth-shell">
        <div class="card auth-card">
          <h1>Sign In</h1>
          <form id="loginForm" novalidate>
            <div class="field-group">
              <label for="loginUsername">Username</label>
              <input
                id="loginUsername"
                name="username"
                type="text"
                autocomplete="username"
                required
              />
            </div>
            <div class="field-group">
              <label for="loginPassword">Password</label>
              <input
                id="loginPassword"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
          </form>
          <p id="loginError" class="form-message error-message" aria-live="polite"></p>
          <p class="form-hint">Don't have an account? <a href="register.html">Register</a></p>
          <p class="form-hint muted">Demo admin: admin / admin@123</p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <p>Team 1, Section 12 — DSA-3 (25CS2103E)</p>
      </div>
    </footer>
  </body>
</html>
